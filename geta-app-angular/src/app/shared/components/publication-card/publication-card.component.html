<!--
  O container principal do card da publicação.
  Usa 'ngIf' para garantir que o card só é renderizado se o objeto 'publication' existir.
-->
<div *ngIf="publication" class="bg-white rounded-xl shadow-md overflow-hidden mb-6 border border-gray-200 hover:shadow-lg transition-shadow duration-300 hover:border-primary-300">
  <div class="p-6">
    <!-- Cabeçalho do Card: contém o avatar, nome de utilizador e data -->
    <div class="flex items-center mb-4">
      <!-- Link para o perfil do utilizador, envolvendo o avatar -->
      <a [routerLink]="['/profile', publication.userId]" class="flex-shrink-0">
        <img class="h-12 w-12 rounded-full object-cover" [src]="publication.userAvatarUrl || 'assets/default-avatar.png'" alt="Avatar de {{ publication.username }}">
      </a>
      <div class="ml-4">
        <!-- Link para o perfil do utilizador, envolvendo o nome de utilizador -->
        <a [routerLink]="['/profile', publication.userId]" class="font-bold text-gray-900 hover:underline hover:text-primary-600">{{ publication.username }}</a>
        <!-- Data da publicação, formatada pelo DatePipe -->
        <p class="text-sm text-gray-500">{{ publication.createdAt | date:'medium' }}</p>
      </div>
    </div>

    <!--
      Corpo do Card: contém o conteúdo da publicação.
      É um link que leva à página de visualização detalhada da publicação.
    -->
    <a [routerLink]="['/publication', publication.id]" class="block cursor-pointer group mt-4">
      <p class="text-gray-800 group-hover:text-gray-900 whitespace-pre-wrap">
        {{ publication.content }}
      </p>
    </a>
  </div>

  <!--
    Rodapé do Card: contém ações, como o link para os comentários.
    Esta secção tem um fundo ligeiramente diferente para se destacar.
  -->
  <div class="border-t border-gray-200 px-6 py-3 bg-gray-50">
    <!-- Link que leva à página de visualização detalhada, focado na secção de comentários -->
    <a [routerLink]="['/publication', publication.id]" class="flex items-center text-gray-600 hover:text-primary-600 transition-colors w-fit-content">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
      </svg>
      <!-- Exibe a contagem de comentários. Se 'commentCount' não existir, mostra '0'. -->
      <span class="text-sm font-medium">
        {{ publication.commentCount || 0 }} Comentários
      </span>
    </a>
  </div>
</div>
