<div class="max-w-2xl mx-auto">
  <h1 class="text-3xl font-bold">Feed</h1>
  <p class="text-primary-200 mt-1">Veja as últimas publicações</p>
  <hr class="my-4 border-gray-300">
  <!-- Verifica se o utilizador está autenticado -->
  <!-- <div *ngIf="user$ | async as user; else loggedOut">
    <p class="text-gray-600 mb-4">Olá, {{ user.username }}!</p>
  </div>
  <ng-template #loggedOut>
    <p class="text-gray-600 mb-4">Por favor, faça login para ver as publicações.</p>
  </ng-template> -->

  <!-- Formulário de Nova Publicação -->
  <div class="bg-white p-4 rounded-lg shadow-md mb-6">
    <form [formGroup]="publicationForm" (ngSubmit)="onSubmit()">
      <textarea formControlName="content"
                class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 transition-shadow"
                rows="3"
                placeholder="O que você está a pensar?"></textarea>
      <div class="flex justify-end mt-2">
        <button type="submit"
                [disabled]="publicationForm.invalid"
                class="bg-primary-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-primary-700 disabled:bg-gray-400 transition-colors shadow-sm hover:shadow-md">
          Publicar
        </button>
      </div>
    </form>
  </div>

  <!-- Feed de Publicações -->
  <div *ngIf="isLoading" class="text-center py-10">
    <p class="text-gray-500">A carregar publicações...</p>
    <!-- Pode adicionar um spinner aqui -->
  </div>

  <div *ngIf="error" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded-md shadow mb-6" role="alert">
    <p class="font-bold">Erro</p>
    <p>{{ error }}</p>
  </div>

  <div *ngIf="!isLoading">
    <div *ngIf="publications.length > 0; else noPublications">
      <app-publication-card *ngFor="let publication of publications" [publication]="publication"></app-publication-card>
    </div>
    <ng-template #noPublications>
      <div class="text-center py-10 bg-white rounded-lg shadow-md">
        <p class="text-gray-500">Ainda não há publicações. Seja o primeiro a publicar algo!</p>
      </div>
    </ng-template>
  </div>

  <!-- Botão de Carregar Mais -->
  <div *ngIf="hasMorePublications && !isLoading" class="text-center mt-6">
    <button (click)="loadMore()"
            [disabled]="isLoadingMore"
            class="bg-secondary-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-secondary-700 disabled:bg-gray-400 transition-colors shadow-sm hover:shadow-md">
      <span *ngIf="!isLoadingMore">Carregar Mais</span>
      <span *ngIf="isLoadingMore">A carregar...</span>
    </button>
  </div>
</div>
