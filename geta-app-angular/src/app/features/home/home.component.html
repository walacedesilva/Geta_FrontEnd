<div class="max-w-2xl mx-auto">

  <div class="p-4">
    <h1 class="text-2xl font-bold text-white">Empresários</h1>
    <p class="text-sm text-gray-400">Conecte-se com outros profissionais</p>

    <div class="relative mt-4">
      <input type="text" placeholder="Buscar"
             class="w-full py-3 pl-4 pr-10 text-white bg-light-purple-card border-transparent rounded-full focus:ring-accent-green focus:border-accent-green">
      <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
        <svg class="w-5 h-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"></path></svg>
      </div>
    </div>
  </div>

  <div class="mt-2 space-y-4">
  <div *ngIf="publications && publications.length > 0; else noPublications">
      <app-publication-card *ngFor="let pub of publications" [publication]="pub">
      </app-publication-card>
    </div>
        <ng-template #noPublications>
      <p class="text-center text-gray-500 mt-8">Ainda não há publicações. Seja o primeiro a partilhar algo!</p>
    </ng-template>
    </div>

  <!-- Estado de Carregamento Inicial -->
  <div *ngIf="isLoading" class="text-center p-8">
    <p class="text-gray-500">A carregar publicações...</p>
    <!-- Pode adicionar um spinner aqui -->
  </div>
  </div>
