<!-- Container principal que aguarda os dados do utilizador -->
<div *ngIf="user$ | async as user; else loadingOrError" class="max-w-4xl mx-auto">

  <!-- Modo de Visualização -->
  <div *ngIf="!isEditMode" class="bg-white p-6 rounded-lg shadow-md mb-8 max-w-3xl mx-auto">
    <div class="flex flex-col sm:flex-row items-center">
      <img
        class="h-24 w-24 rounded-full object-cover mr-0 sm:mr-6 mb-4 sm:mb-0 border-4 border-gray-200"
        [src]="user.avatarUrl || 'assets/default-avatar.png'"
        alt="Avatar de {{ user.username }}">

      <div class="text-center sm:text-left flex-grow">
        <h1 class="text-3xl font-bold text-gray-900">{{ user.username }}</h1>
        <p class="text-gray-600 mt-1">{{ user.email }}</p>
        <p class="text-sm text-gray-500 mt-2">Membro desde: {{ user.memberSince | date:'longDate' }}</p>
      </div>

      <!-- Botão para entrar no modo de edição (apenas se for o próprio perfil) -->
      <button *ngIf="isOwnProfile" (click)="enterEditMode()" class="mt-4 sm:mt-0 bg-primary-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-primary-700 transition-colors">
        Editar Perfil
      </button>
    </div>
  </div>

  <!-- Modo de Edição -->
  <div *ngIf="isEditMode" class="bg-white p-6 rounded-lg shadow-md mb-8 max-w-3xl mx-auto">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">Editar Perfil</h2>
    <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
       <div class="mb-4">
        <label for="username" class="block text-gray-700">Nome de utilizador</label>
        <input id="username" type="text" formControlName="username" class="w-full px-4 py-2 mt-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500">
      </div>
      <div class="mb-4">
        <label for="email" class="block text-gray-700">Email</label>
        <input id="email" type="email" formControlName="email" class="w-full px-4 py-2 mt-2 border rounded-lg bg-gray-200 cursor-not-allowed">
      </div>
      <div class="mb-4">
        <label for="location" class="block text-sm font-medium text-gray-700 mb-1">Endereço</label>
        <input id="location" type="text" formControlName="location" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="mb-6">
        <label for="avatarUrl" class="block text-sm font-medium text-gray-700 mb-1">URL do Avatar</label>
        <input id="avatarUrl" type="text" formControlName="avatarUrl" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="mb-6">
        <label for="bio" class="block text-sm font-medium text-gray-700 mb-1">Biografia</label>
        <input id="bio" type="text" formControlName="bio" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="flex justify-end gap-4">
        <button type="button" (click)="cancelEdit()" class="bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-lg hover:bg-gray-300 transition-colors">
          Cancelar
        </button>
        <button type="submit" [disabled]="profileForm.invalid" class="bg-secondary-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-secondary-700 disabled:bg-gray-400 transition-colors">
          Guardar Alterações
        </button>
      </div>
    </form>
  </div>


  <!-- Título para a secção de publicações -->
  <h2 class="text-2xl font-semibold text-gray-800 mb-4 max-w-3xl mx-auto">Publicações</h2>

  <!-- Secção de Publicações -->
  <div class="bg-white p-6 rounded-lg shadow-md mb-8 max-w-3xl mx-auto">
    <div *ngIf="isLoadingPublications" class="text-center py-10">
      <p class="text-gray-500">A carregar publicações...</p>
    </div>

    <div *ngIf="publicationsError" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded-md shadow mb-6" role="alert">
      <p>{{ publicationsError }}</p>
    </div>

    <div *ngIf="!isLoadingPublications && publications.length > 0">
      <app-publication-card *ngFor="let publication of publications" [publication]="publication"></app-publication-card>
    </div>

    <div *ngIf="!isLoadingPublications && publications.length === 0 && !publicationsError" class="text-center py-10 bg-white rounded-lg shadow-md">
      <p class="text-gray-500">Este utilizador ainda não fez nenhuma publicação.</p>
    </div>

    <!-- Botão de Carregar Mais -->
    <div *ngIf="hasMorePublications && !isLoadingPublications" class="text-center mt-6">
      <button (click)="loadMorePublications()" class="bg-secondary-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-secondary-700 transition-colors">
        Carregar Mais
      </button>
    </div>
  </div>

</div>
<ng-template #loadingOrError>
  <div *ngIf="error; else loading" class="text-center text-red-500 p-6 bg-red-100 rounded-lg">
    {{ error }}
  </div>
  <ng-template #loading>
    <div class="text-center p-6">A carregar perfil...</div>
  </ng-template>
</ng-template>
