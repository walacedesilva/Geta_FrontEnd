<!-- O ng-container verifica o estado do showHeader$ -->
<ng-container *ngIf="showHeader$ | async; else fullScreenLayout">
  <!-- Layout Padrão com Cabeçalho -->
  <header class="bg-gradient-to-br from-primary-900 to-secondary-900 p-6 text-white rounded-b-[2.5rem] shadow-lg z-10">
    <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
      <a routerLink="/home" class="text-2xl font-bold text-secondary-400 hover:text-secondary-300 transition-colors">Geta</a>
      <div class="flex justify-between items-center mb-4">
        <ng-container *ngIf="user$ | async as user; else loggedOut">
          <span class="font-semibold hidden sm:block">Olá, {{ user.username }}</span>
          <!-- <a [routerLink]="['/profile', user.id]">
          <img [src]="user.avatarUrl" alt="User"
          class="h-9 w-9 rounded-full object-cover border-2 border-primary-300">
          </a> -->
          <a [routerLink]="['/profile', user.id]" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-primary-700 transition-colors">Perfil</a>
          <a routerLink="/chat" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-primary-700 transition-colors">Chat</a>
          <button (click)="logout()" class="px-3 py-2 rounded-md text-sm font-medium bg-red-600 hover:bg-red-700 transition-colors">Sair</button>
        </ng-container>
        <ng-template #loggedOut>
          <a routerLink="/auth" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-primary-700 transition-colors">Login</a>
        </ng-template>
      </div>
    </nav>
  </header>
  <main class="container mx-auto p-4 md:p-6 bg-gray-100 min-h-screen">
    <router-outlet></router-outlet>
  </main>
   <ng-container *ngIf="user$ | async as user; else loggedOut">
  <!-- Rodapé de Navegação Fixo -->
    <footer class="sticky bottom-0 bg-white shadow-[0_-2px_10px_rgba(0,0,0,0.1)] p-4 flex justify-around items-center z-10">
      <a routerLink="/home" class="text-primary-900">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" /></svg>
      </a>
      <a routerLink="/chat" class="text-gray-400 hover:text-primary-900">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 5v8a2 2 0 01-2 2h-5l-5 4v-4H4a2 2 0 01-2-2V5a2 2 0 012-2h12a2 2 0 012 2zM7 8H5v2h2V8zm2 0h2v2H9V8zm6 0h-2v2h2V8z" clip-rule="evenodd" /></svg>
      </a>
      <!-- O link do ícone de perfil foi corrigido para apontar para o perfil do utilizador -->
      <a [routerLink]="['/profile', user.id]" class="text-gray-400 hover:text-primary-900">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" /></svg>
      </a>
    </footer>
    </ng-container>
</ng-container>

<!-- Layout de Ecrã Inteiro (sem cabeçalho e sem padding principal) -->
<ng-template #fullScreenLayout>
  <main class="min-h-screen">
    <router-outlet></router-outlet>
  </main>
</ng-template>

<app-toast></app-toast>
