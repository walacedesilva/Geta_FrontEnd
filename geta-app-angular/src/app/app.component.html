<!-- O ng-container verifica o estado do showHeader$ -->
<ng-container *ngIf="showHeader$ | async; else fullScreenLayout">
  <!-- Layout Padrão com Cabeçalho -->
  <header class="bg-primary-900 text-white shadow-lg sticky top-0 z-50">
    <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
      <a routerLink="/home" class="text-2xl font-bold text-secondary-400 hover:text-secondary-300 transition-colors">Geta</a>
      <div class="flex items-center space-x-4">
        <ng-container *ngIf="user$ | async as user; else loggedOut">
          <span class="font-semibold hidden sm:block">Olá, {{ user.username }}</span>
          <a [routerLink]="['/profile', user.id]" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-primary-700 transition-colors">Perfil</a>
          <a routerLink="/chat" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-primary-700 transition-colors">Chat</a>
          <button (click)="logout()" class="px-3 py-2 rounded-md text-sm font-medium bg-red-600 hover:bg-red-700 transition-colors">Sair</button>
        </ng-container>
        <ng-template #loggedOut>
          <a routerLink="/auth" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-primary-700 transition-colors">Login</a>
        </ng-template>
      </div>
    </nav>
  </header>
  <main class="container mx-auto p-4 md:p-6 bg-gray-100 min-h-screen">
    <router-outlet></router-outlet>
  </main>
</ng-container>

<!-- Layout de Ecrã Inteiro (sem cabeçalho e sem padding principal) -->
<ng-template #fullScreenLayout>
  <main class="min-h-screen">
    <router-outlet></router-outlet>
  </main>
</ng-template>

<app-toast></app-toast>
